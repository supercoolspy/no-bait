[package]
name = "dataset_collector"
version = "0.1.0"
edition = "2024"
description = "A tool to collect datasets for phishing detection"

[dependencies]
env_logger = "0.11.8"
libsql = "0.9.8"
tokio = { version = "1", features = ["full", "tracing"] }
dotenvy = "0.15.7"
serde = "1.0.219"
serde_json = "1.0.140"
flate2 = "1.0"
thiserror = "2.0.12"
reqwest = { version = "0.12.15", features = ["rustls-tls", "http2", "charset"], default-features = false}
reqwest-middleware = { version = "0.4.2", features = ["http2", "rustls-tls", "json"] }
reqwest-retry = { version = "0.7.0" }
url = "2.5.4"
tldextract = "0.6.0"
clap = { version = "4.5.38", features = ["derive"] }
bytes = "1.10.1"
rayon = "1.10.0"
futures = "0.3.31"
icann-rdap-client = "0.0.22"
icann-rdap-common = "0.0.22"
zip = "4.0.0"
csv = "1.3.1"
moka = { version = "0.12.10", features = ["future", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whois-that = "0.1.1"
async-trait = "0.1.88"

[dev-dependencies]
rand = "0.9.1"
